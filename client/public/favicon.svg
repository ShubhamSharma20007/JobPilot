<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="JobPilot" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bg { fill: #111111; }
    .fg { fill: #ffffff; }
    .fold { stroke: #111111; }
    .trail { stroke: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #f5f5f5; }
      .fg { fill: #111111; }
      .fold { stroke: #f5f5f5; }
      .trail { stroke: #111111; }
    }
  </style>
  <rect class="bg" width="64" height="64" rx="16"/>
  <!-- flight trail -->
  <path class="trail" d="M11 50 C15 44 19 42 24 40" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="1 5" opacity="0.7"/>
  <!-- paper plane -->
  <path class="fg" d="M49 15 L14 29 L27 36 L34 50 Z" stroke-linejoin="round"/>
  <!-- fold -->
  <path class="fold" d="M27 36 L49 15" fill="none" stroke-width="2.5" stroke-linecap="round"/>
</svg>
